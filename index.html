<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="assets/css/style.css" rel="stylesheet">
    <title>Conversor de Moeda</title>
    <style>

    </style>
</head>

<body>
    <div class="container">
        <h1>Conversor de Moeda</h1>
        <label for="real">Valor em Reais (R$):</label>
        <input type="number" id="real" placeholder="Ex: 100.00" />
        <label for="opcao">Converter para:</label>
        <select id="opcao">
            <option value="USD">$ - Dólar</option>
            <option value="EUR">€ - Euro</option>
        </select>
        <label for="cotacao">Cotação atual da moeda (R$):</label>
        <input type="number" id="cotacao" placeholder="Ex: 5.50" />
        <button onclick="converter()">Converter</button>
        <div class="resultado" id="resultado"></div>
        <button onclick="irParaProximaTela()" style="margin-bottom: 20px;">Saber Mais</button>
    </div>

    <footer>
        © 2025 Josenito Tutoriais
    </footer>
    <script src="assets/js/app.js"></script>
</body>

</html>
